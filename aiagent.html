    <style>
        :root {
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --glass-bg: rgba(18, 25, 41, 0.62);
            --glass-border: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.12);
            --glass-glow: rgba(56, 189, 248, 0.28);
            --accent-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --input-bg: rgba(6, 9, 17, 0.72);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(56, 189, 248, 0.15) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* ---------- Header (same icon design as the store) ---------- */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 5%;
            background: rgba(7, 10, 18, 0.7);
            -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 50;
        }
        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; color: var(--text-main); text-decoration: none; }
        .brand-logo i { color: var(--accent-cyan); filter: drop-shadow(0 0 10px var(--accent-cyan)); }
        .nav-icons-row { display: flex; align-items: center; gap: 12px; }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .icon-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: 0 0 15px var(--glass-glow); transform: translateY(-1px); }
        .cart-badge {
            position: absolute; top: -4px; right: -4px;
            background: var(--accent-blue); color: white;
            font-size: 0.72rem; font-weight: 800;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg-dark);
        }

        /* ---------- Layout ---------- */
        .container { max-width: 880px; margin: 0 auto; padding: 48px 5% 80px; }
        .hero { text-align: center; margin-bottom: 30px; }
        .hero-tag { color: var(--accent-cyan); text-transform: uppercase; font-size: 0.82rem; letter-spacing: 2px; font-weight: 800; display: inline-block; margin-bottom: 12px; }
        .hero h1 { font-size: clamp(1.9rem, 5vw, 2.8rem); font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin-bottom: 12px; }
        .hero h1 span { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .hero p { color: var(--text-muted); font-size: 1rem; line-height: 1.6; max-width: 560px; margin: 0 auto; }

        .glass-card {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.015) 40%), var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 26px;
            -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            margin-bottom: 20px;
            animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        textarea#projectInput {
            width: 100%; min-height: 110px; resize: vertical;
            background: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 16px 18px; font-size: 1rem; line-height: 1.5; outline: none;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
        }
        textarea#projectInput::placeholder { color: rgba(148, 163, 184, 0.6); }
        textarea#projectInput:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12), 0 0 18px var(--glass-glow); }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
        .chip {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: var(--text-muted);
            padding: 7px 14px; border-radius: 99px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
        }
        .chip:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.08); }

        .btn-primary {
            position: relative; overflow: hidden;
            width: 100%; padding: 15px 22px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, #1d4ed8 55%, #0ea5e9 130%);
            color: white; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: all 0.25s ease; text-decoration: none;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary {
            width: 100%; padding: 14px 20px; background: rgba(255, 255, 255, 0.05); color: var(--text-main);
            border: 1px solid var(--glass-border); border-radius: 14px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: all 0.25s ease;
        }
        .btn-secondary:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        /* ---------- Loading / error ---------- */
        .loader { display: none; text-align: center; padding: 34px 10px; color: var(--text-muted); }
        .loader.active { display: block; }
        .loader i { font-size: 1.8rem; color: var(--accent-cyan); margin-bottom: 12px; filter: drop-shadow(0 0 10px var(--accent-cyan)); }
        .error-box { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; border-radius: 14px; padding: 14px 16px; font-size: 0.9rem; line-height: 1.5; }

        /* ---------- Result ---------- */
        .result-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.4px; }
        .result-overview { color: var(--text-muted); line-height: 1.65; font-size: 0.95rem; }
        .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--accent-cyan); }
        .steps { padding-left: 20px; color: var(--text-muted); line-height: 1.7; font-size: 0.93rem; }
        .steps li { margin-bottom: 6px; padding-left: 4px; }
        .steps li::marker { color: var(--accent-cyan); font-weight: 700; }

        .part-row {
            display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; align-items: center; gap: 14px;
            padding: 12px; border-radius: 16px; border: 1px solid transparent; transition: all 0.2s ease;
        }
        .part-row + .part-row { margin-top: 4px; }
        .part-row:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--glass-border); }
        .part-img { width: 56px; height: 56px; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); }
        .part-img img { max-width: 84%; max-height: 84%; object-fit: contain; }
        .part-info { min-width: 0; }
        .part-name { font-weight: 700; font-size: 0.93rem; line-height: 1.3; }
        .part-reason { color: var(--text-muted); font-size: 0.8rem; line-height: 1.45; margin-top: 3px; }
        .part-price { text-align: right; white-space: nowrap; }
        .part-price b { display: block; color: var(--accent-cyan); font-size: 0.95rem; }
        .part-price small { color: var(--text-muted); font-size: 0.75rem; }
        .part-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; width: 32px; height: 32px; border-radius: 50%; transition: all 0.2s ease; }
        .part-remove:hover { color: var(--danger); background: rgba(239, 68, 68, 0.12); }

        .total-bar { display: flex; justify-content: space-between; align-items: center; margin: 18px 4px 16px; padding-top: 16px; border-top: 1px solid var(--glass-border); }
        .total-bar span { color: var(--text-muted); font-weight: 600; }
        .total-bar b { font-size: 1.5rem; font-weight: 800; }
        .cart-actions { display: none; gap: 12px; margin-top: 12px; }
        .cart-actions.show { display: flex; animation: rise 0.35s ease both; }
        .cart-actions > * { flex: 1; }

        .other-list { list-style: none; }
        .other-list li { display: flex; justify-content: space-between; gap: 14px; padding: 10px 4px; border-bottom: 1px dashed rgba(255, 255, 255, 0.08); font-size: 0.9rem; }
        .other-list li:last-child { border-bottom: none; }
        .other-list small { color: var(--text-muted); display: block; margin-top: 2px; }
        .other-list .qty { color: var(--accent-cyan); font-weight: 700; white-space: nowrap; }

        /* Arabic answers / prompts render right-to-left automatically */
        textarea#projectInput, .result-title, .result-overview, .steps li, .part-name, .part-reason, .other-list b, .other-list small { unicode-bidi: plaintext; text-align: start; }

        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
            background: rgba(15, 23, 42, 0.95); border: 1px solid var(--accent-cyan); color: var(--text-main);
            padding: 12px 22px; border-radius: 99px; font-weight: 600; font-size: 0.9rem; z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 18px var(--glass-glow); transition: all 0.3s ease;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (max-width: 600px) {
            .glass-card { padding: 18px; border-radius: 20px; }
            .part-row { grid-template-columns: 48px minmax(0, 1fr) auto; }
            .part-img { width: 48px; height: 48px; }
            .part-remove { grid-column: 3; grid-row: 1; justify-self: end; }
            .part-price { grid-column: 2 / 4; text-align: left; }
            .part-price b, .part-price small { display: inline; margin-right: 8px; }
            .cart-actions { flex-direction: column; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>

    <script>
        const _kPart1 = window._ahCfgSeg1 || "QVEuQWI4Uk42TF9oTF";
        async function callAI(messages, timeoutMs) {
            if (typeof window._aicbCallAI === "function") {
                return window._aicbCallAI(messages, timeoutMs);
            }
            const DIRECT_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai";
            const DIRECT_MODELS = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.8-flash"];
            const _kPart2 = "NfRUtvRW1oeGVObFRx";
            const key = atob([_kPart1, _kPart2, _kPart3, _kPart4].join(""));
            if (location.protocol !== "file:") {
                let ctrl = new AbortController();
                let t = setTimeout(function() { ctrl.abort(); }, timeoutMs);
                try {
                    let res = await fetch("/api/ai/chat", {
                        method: "POST", signal: ctrl.signal,
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ messages })
                    });
                    clearTimeout(t);
                    let data = null; try { data = await res.json(); } catch(e){}
                    if (res.ok && data && typeof data.content === "string") return data.content;
                } catch (e) { clearTimeout(t); }
            }
            let lastErr = null;
            for (const model of DIRECT_MODELS) {
                let ctrl = new AbortController();
                let t = setTimeout(function() { ctrl.abort(); }, timeoutMs);
                try {
                    let res = await fetch(DIRECT_BASE_URL + "/chat/completions", {
                        method: "POST", signal: ctrl.signal,
                        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
                        body: JSON.stringify({ model, messages, temperature: 0.3, max_tokens: 4000, response_format: { type: "json_object" } })
                    });
                    clearTimeout(t);
                    let data = null; try { data = await res.json(); } catch(e){}
                    if (res.ok && data && data.choices && data.choices[0] && data.choices[0].message && typeof data.choices[0].message.content === "string") {
                        return data.choices[0].message.content;
                    }
                } catch (e) { clearTimeout(t); lastErr = e; }
            }
            throw lastErr || new Error("The AI service is currently unavailable. Please try again.");
        }
        const AI_TIMEOUT_MS = 45000;

        let catalog = [];           // all store products
        let currentPlan = null;     // { title, overview, steps[], storeItems[], otherItems[] }
        const _kPart3 = "MTA4eUlwNldQZG5FQU";

        /* ---------------- helpers ---------------- */
        function escapeHTML(str) {
            return String(str == null ? "" : str)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function unitPrice(p) {
            const hasOffer = p.offerPrice !== undefined && p.offerPrice !== null && p.offerPrice !== "";
            const v = parseFloat(hasOffer ? p.offerPrice : p.price);
            return isNaN(v) ? 0 : v;
        }

        function readCart() {
            try { return JSON.parse(localStorage.getItem("arduino_hub_cart")) || []; } catch (e) { return []; }
        }

        function updateCartBadge() {
            const count = readCart().reduce((s, i) => s + (i.qty || 0), 0);
            document.getElementById("cartCount").innerText = count;
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg;
            t.classList.add("show");
            setTimeout(function() { t.classList.remove("show"); }, 2400);
        }

        function withTimeout(promise, ms) {
            return new Promise(function(resolve, reject) {
                const timer = setTimeout(function() { reject(new Error("Timed out")); }, ms);
                promise.then(function(v) { clearTimeout(timer); resolve(v); }, function(e) { clearTimeout(timer); reject(e); });
            });
        }

        function useExample(btn) {
            const input = document.getElementById("projectInput");
            input.value = "I want to make a " + btn.innerText.toLowerCase();
            input.focus();
        }

        /* ---------------- catalog ---------------- */
        async function loadCatalog() {
            try {
                if (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length) {
                    const snap = await withTimeout(firebase.firestore().collection("products").get(), 7000);
                    const arr = [];
                    snap.forEach(function(d) { arr.push(Object.assign({ id: d.id }, d.data())); });
                    if (arr.length > 100) return arr;
                }
            } catch (e) {
                console.warn("Firestore SDK catalog unavailable, falling back to REST:", e);
            }
            try {
                let allDocs = [];
                let pageToken = "";
                let guard = 0;
                do {
                    const url = "https://firestore.googleapis.com/v1/projects/arduinohubfinal/databases/(default)/documents/products?pageSize=300" +
                        (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : "");
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data && Array.isArray(data.documents)) {
                        allDocs = allDocs.concat(data.documents);
                    }
                    pageToken = (data && data.nextPageToken) ? data.nextPageToken : "";
                    guard++;
                } while (pageToken && guard < 10);

                if (allDocs.length) {
                    return allDocs.map(function(doc) {
                        const f = doc.fields || {};
                        function val(v) {
                            if (!v) return "";
                            if (v.stringValue !== undefined) return v.stringValue;
                            if (v.integerValue !== undefined) return Number(v.integerValue);
                            if (v.doubleValue !== undefined) return Number(v.doubleValue);
                            if (v.booleanValue !== undefined) return Boolean(v.booleanValue);
                            return "";
                        }
                        return {
                            id: (doc.name || "").split("/").pop(),
                            title: val(f.title),
                            price: val(f.price),
                            offerPrice: val(f.offerPrice),
                            image: val(f.image),
                            category: val(f.category),
                            stock: val(f.stock)
                        };
                    });
                }
            } catch (e2) {
                console.warn("Firestore REST fallback failed:", e2);
            }
            return [];
        }

        /* ---------------- AI ---------------- */
        function buildMessages(userPrompt) {
            const system =
                "You are a Senior Embedded Hardware Engineer and project assistant at 'Arduino Hub', an electronics store. " +
                "The user describes an electronics / Arduino / ESP32 / robotics project. " +
                "Act like a real engineer and work out EVERY single component needed to build a complete working circuit.\n\n" +
                "AVAILABLE STORE DATABASE PRODUCTS (" + catalog.length + " products in our database — Always prioritize choosing from this database and use these EXACT English titles for 'name' in components_needed whenever a matching part exists in our database):\n" +
                (catalog.map(function(p) { return "- " + (p.title || "Unknown"); }).join("\n")) + "\n\n" +
                "RULES:\n" +
                "- Reply with ONE valid JSON object only, no markdown, no extra text.\n" +
                "- Write all human-readable text in the SAME language as the user's request (Arabic or English). JSON keys stay in English.\n" +
                "- ALWAYS choose components from the AVAILABLE STORE DATABASE PRODUCTS above using their exact English title whenever available.\n" +
                "- If a required component is NOT in the database list above, STILL include it in 'components_needed' with its standard English component name (our UI will display it with 'Undefined price').\n" +
                "- 'components_needed': MUST include the complete logical engineer bill of materials: Microcontroller Board, Breadboard, Jumper Wires, Power Supply (Battery/Adapter), Drivers/Relays/Resistors/LEDs, and all Sensors & Motors with accurate 1-to-1 physical quantities (e.g. 2 gates = 2 servos + 2 sensors).\n" +
                "- For EVERY item in 'components_needed', provide BOTH 'reason' (why we chose this product) and 'connection' (basic pin-to-pin how to connect guide).\n" +
                "- Quantities are integers between 1 and 20.\n" +
                "- If the request is not an electronics project, return empty array and explain politely in 'overview'.\n\n" +
                "JSON SHAPE:\n" +
                "{\n  \"project_title\": \"string\",\n  \"overview\": \"2-3 sentences\",\n  \"steps\": [\"4-6 clear build & wiring steps\"],\n  \"components_needed\": [{\"name\": \"EXACT store product title in English (or standard English name if not in store)\", \"qty\": 1, \"reason\": \"why we chose this component\", \"connection\": \"basic pin-to-pin how to connect guide\"}]\n}";

            return [
                { role: "system", content: system },
                { role: "user", content: userPrompt }
            ];
        }

        async function askAI(userPrompt) {
            const messages = buildMessages(userPrompt);
            return callAI(messages, AI_TIMEOUT_MS);
        }

        function parseAIJson(text) {
            try { return JSON.parse(text); } catch (e) { /* try to extract */ }
            const start = text.indexOf("{");
            const end = text.lastIndexOf("}");
            if (start > -1 && end > start) return JSON.parse(text.slice(start, end + 1));
            throw new Error("The AI returned an unreadable answer. Please try again.");
        }

        const STOP_WORDS = new Set(["with", "and", "for", "the", "pcs", "pack", "module", "from", "into", "board", "development"]);

        function cleanItemName(str) {
            return String(str || "")
                .replace(/^[\u26A0\u2757\u2139\*\-\s]+/, "")
                .replace(/^required\s+but\s+(?:currently\s+)?unavailable\s*:\s*/i, "")
                .replace(/^\(unavailable\)\s*/i, "")
                .trim();
        }

        function defaultConnectionFor(name, isAr) {
            const n = String(name || "").toLowerCase();
            if (/arduino|esp32|stm32|leonardo|mega|nano|uno|due/.test(n)) {
                return isAr
                    ? "وصّل طرف 5V بالخط الموجب (+) في البريدبورد، وطرف GND بالخط السالب (-) المشترك، ووصّل البوردة بالكمبيوتر عبر USB لرفع الكود."
                    : "Connect 5V pin → Breadboard (+) rail, GND pin → Breadboard (-) common ground rail, and connect USB to upload code.";
            }
            if (/breadboard|لوح تجارب/.test(n)) {
                return isAr
                    ? "وصّل خط التغذية الأحمر (+) بـ 5V من البوردة، والخط الأزرق (-) بـ GND، واستخدم الصفوف الوسطى لتوصيل أطراف الحساسات."
                    : "Wire the red (+) side rail to Arduino 5V and blue (-) side rail to Arduino GND; plug components across the terminal rows.";
            }
            if (/jumper|wire|dupont|أسلاك/.test(n)) {
                return isAr
                    ? "استخدم أسلاك (ذكر-ذكر) لتوصيل البوردة بالبريدبورد، وأسلاك (ذكر-أنثى) لتوصيل بنات الحساسات والموديولات."
                    : "Use Male-to-Male wires between Arduino & Breadboard rails, and Male-to-Female wires from sensor/module pins to the board.";
            }
            if (/hc-sr04|ultrasonic/.test(n)) {
                return isAr
                    ? "VCC ← 5V في البريدبورد | GND ← السالب المشترك | TRIG ← بن رقمي (مثل D9) | ECHO ← بن رقمي (مثل D10)."
                    : "VCC → Breadboard 5V rail | GND → Common GND | TRIG → Arduino Digital Pin (e.g. D9) | ECHO → Digital Pin (e.g. D10).";
            }
            if (/servo|sg90|mg90|mg995|mg996/.test(n)) {
                return isAr
                    ? "السلك الأحمر (VCC) ← 5V | السلك البني/الأسود (GND) ← الأرضي | السلك البرتقالي (Signal) ← بن PWM في الأردوينو (مثل D3 أو D5 أو D6)."
                    : "Red wire (VCC) → 5V rail | Brown/Black wire (GND) → Common GND | Orange/Yellow wire (Signal) → Arduino PWM Pin (e.g. D3, D5, or D6).";
            }
            if (/l298|l293|motor driver/.test(n)) {
                return isAr
                    ? "OUT1–OUT4 ← أطراف المواتير | 12V/VCC ← موجب البطارية | GND ← سالب البطارية + GND الأردوينو معاً | IN1–IN4 و ENA/ENB ← بنات الأردوينو."
                    : "OUT1–OUT4 → DC Motors | 12V/VCC → Battery (+) | GND → Battery (-) & Arduino GND (common ground) | IN1–IN4 & ENA/ENB → Arduino Digital/PWM Pins.";
            }
            if (/relay/.test(n)) {
                return isAr
                    ? "VCC ← 5V | GND ← الأرضي | IN ← بن رقمي في الأردوينو | وصّل طرف الكهرباء للحمل عبر مسماري COM و NO."
                    : "VCC → 5V | GND → Common GND | IN → Arduino Digital Pin | Wire load power line in series through COM and NO screw terminals.";
            }
            if (/lcd|1602|2004|i2c|pcf8574|oled/.test(n)) {
                return isAr
                    ? "عبر واجهة I2C: طرف VCC ← 5V | GND ← الأرضي | SDA ← بن A4 (أو SDA) | SCL ← بن A5 (أو SCL)."
                    : "Via I2C pins: VCC → 5V rail | GND → Common GND | SDA → Arduino Pin A4 (or SDA) | SCL → Arduino Pin A5 (or SCL).";
            }
            return isAr
                ? "VCC ← 5V في البريدبورد | GND ← الأرضي المشترك (GND) | OUT/Signal ← البن الرقمي أو التناظري المخصص في البوردة."
                : "VCC → Breadboard 5V rail | GND → Common GND rail | OUT/Signal → Assigned Digital/Analog Input Pin on the board.";
        }

        function findProduct(item) {
            if (!item) return null;
            if (typeof item === "string") item = { name: item };
            if (item.id) {
                const byId = catalog.find(function(p) { return String(p.id) === String(item.id); });
                if (byId) return byId;
            }
            const rawName = cleanItemName(item.name || item.item || item.component || item.title || item.specification || "");
            const text = rawName.toLowerCase();
            if (!text) return null;

            const exact = catalog.find(function(p) { return (p.title || "").toLowerCase().trim() === text; });
            if (exact) return exact;

            function isIncompatibleCandidate(queryText, pTitle) {
                if (/^usb\b|\bcable\s+for\b/i.test(pTitle) && !/^usb\b|\bcable\b/i.test(queryText)) return true;
                if (/\bstorage\s+box\b|\borganizer\b/i.test(pTitle) && !/\bbox\b|\borganizer\b/i.test(queryText)) return true;
                if (/\bcopier\b|\bduplicator\b/i.test(pTitle) && !/\bcopier\b|\bduplicator\b/i.test(queryText)) return true;
                if (/\bholder\b/i.test(pTitle) && /\bbattery\b/i.test(queryText) && !/\bholder\b|\bcase\b|\bslot\b/i.test(queryText)) return true;
                if (/\bjumper\s+wire\b/i.test(pTitle) && /\bbreadboard\b/i.test(queryText) && !/\bwire\b|\bjumper\b/i.test(queryText)) return true;
                if (/\bpower\s+supply\b|\bmb102\b/i.test(pTitle) && /\bbreadboard\b/i.test(queryText) && !/\bpower\b|\bmb102\b|\bsupply\b/i.test(queryText)) return true;
                if (/\bchassis\s+kit\b/i.test(pTitle) && !/\bchassis\b|\bkit\b|\bframe\b|\bcar\b/i.test(queryText)) return true;
                const SPECIFIC_TOKENS = [
                    "uno", "mega", "nano", "leonardo", "due", "esp32", "esp8266", "stm32", "raspberry",
                    "ultrasonic", "sr04", "pir", "sr501", "ldr", "soil", "flame", "rain", "hx711",
                    "oled", "ssd1306", "keypad", "fingerprint", "gps", "gsm", "sim800", "sim900",
                    "stepper", "uln2003", "a4988", "pump", "solenoid", "9v", "18650", "2wd", "4wd"
                ];
                for (let k = 0; k < SPECIFIC_TOKENS.length; k++) {
                    const rx = new RegExp("\\b" + SPECIFIC_TOKENS[k] + "\\b", "i");
                    if (rx.test(queryText) && !rx.test(pTitle)) return true;
                }
                return false;
            }

            const subCandidates = catalog.filter(function(p) {
                const t = (p.title || "").toLowerCase().trim();
                if (!t || isIncompatibleCandidate(text, t)) return false;
                return t.indexOf(text) > -1 || (t.length > 5 && text.indexOf(t) > -1);
            });
            if (subCandidates.length) {
                subCandidates.sort(function(a, b) {
                    return Math.abs((a.title || "").length - text.length) - Math.abs((b.title || "").length - text.length);
                });
                return subCandidates[0];
            }

            const normText = text.replace(/\bl298n\b/g, "l298").replace(/16x2/g, "1602");
            const words = normText.replace(/[^a-z0-9]/g, ' ').split(/\s+/).filter(function(w) { return w.length > 1 && !STOP_WORDS.has(w); });
            if (!words.length) return null;

            let bestMatch = null;
            let bestScore = 0;

            catalog.forEach(function(p) {
                const pTitle = (p.title || "").toLowerCase();
                if (isIncompatibleCandidate(normText, pTitle)) return;
                const normPTitle = pTitle.replace(/\bl298n\b/g, "l298").replace(/16x2|16×2/g, "1602");
                const pWordsArr = normPTitle.replace(/[^a-z0-9]/g, ' ').split(/\s+/).filter(function(w) { return w.length > 1 && !STOP_WORDS.has(w); });
                if (!pWordsArr.length) return;
                const pWords = new Set(pWordsArr);
                let matches = 0;
                words.forEach(function(w) {
                    if (pWords.has(w)) matches++;
                });
                if (matches > 0) {
                    let score = matches / Math.max(words.length, Math.min(pWords.size, words.length + 1));
                    if (matches >= 2 && matches === words.length) score = Math.max(score, 0.85);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMatch = p;
                    }
                }
            });

            return bestScore >= 0.5 ? bestMatch : null;
        }

        function normalizePlan(raw) {
            const merged = {};
            const extra = [];
            const isAr = /[\u0600-\u06FF]/.test((raw.overview || "") + " " + (raw.project_title || ""));
            const allItems = (Array.isArray(raw.components_needed) ? raw.components_needed : [])
                .concat(Array.isArray(raw.components) ? raw.components : [])
                .concat(Array.isArray(raw.store_items) ? raw.store_items : [])
                .concat(Array.isArray(raw.other_items) ? raw.other_items : []);

            allItems.forEach(function(it) {
                if (!it) return;
                const itemName = cleanItemName(it.name || it.item || it.component || it.title || it.specification || "");
                const product = findProduct(Object.assign({}, it, { name: itemName }));
                const rawQty = it.qty !== undefined ? it.qty : (it.quantity !== undefined ? it.quantity : 1);
                const qty = Math.min(20, Math.max(1, parseInt(rawQty, 10) || 1));
                const reason = it.reason || it.why || it.purpose || it.specification || it.description || "";
                const targetName = (product && product.title) ? product.title : itemName;
                const connection = it.connection || it.how_to_connect || it.wiring || defaultConnectionFor(targetName, isAr);
                if (product) {
                    if (merged[product.id]) merged[product.id].qty = Math.min(20, merged[product.id].qty + qty);
                    else merged[product.id] = { product: product, qty: qty, reason: reason, connection: connection };
                } else if (itemName) {
                    extra.push({ name: itemName, qty: qty, reason: reason, connection: connection });
                }
            });

            return {
                title: raw.project_title || "Your project",
                overview: raw.overview || "",
                isAr: isAr,
                steps: Array.isArray(raw.steps) ? raw.steps : [],
                storeItems: Object.keys(merged).map(function(k) { return merged[k]; }),
                otherItems: extra
            };
        }

        /* ---------------- main flow ---------------- */
        async function generatePlan() {
            const input = document.getElementById("projectInput");
            const prompt = input.value.trim();
            if (prompt.length < 5) { showToast("Please describe your project first"); input.focus(); return; }

            const btn = document.getElementById("buildBtn");
            const loader = document.getElementById("loader");
            const area = document.getElementById("resultArea");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Thinking...';
            loader.classList.add("active");
            area.innerHTML = "";

            try {
                if (!catalog.length) catalog = await loadCatalog();
                const answer = await askAI(prompt);
                currentPlan = normalizePlan(parseAIJson(answer));
                renderPlan();
            } catch (e) {
                console.error(e);
                let msg = e.message || "Something went wrong.";
                if (e.status === 429) msg = "AI rate limit reached. Please wait a moment and try again.";
                area.innerHTML = '<div class="error-box"><i class="fa-solid fa-triangle-exclamation"></i> ' + escapeHTML(msg) + '</div>';
            } finally {
                loader.classList.remove("active");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generate Components List';
            }
        }

        function renderPlan() {
            const area = document.getElementById("resultArea");
            const plan = currentPlan;
            let html = "";

            html += '<section class="glass-card"><div class="result-title">' + escapeHTML(plan.title) + '</div>' +
                    '<p class="result-overview">' + escapeHTML(plan.overview) + '</p></section>';

            if (plan.steps.length) {
                html += '<section class="glass-card"><div class="section-title"><i class="fa-solid fa-list-check"></i> How to build &amp; wire it</div><ol class="steps">' +
                        plan.steps.map(function(s) { return '<li>' + escapeHTML(s) + '</li>'; }).join("") + '</ol></section>';
            }

            html += '<section class="glass-card" id="storeCard"></section>';

            area.innerHTML = html;
            renderStoreItems();
            area.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function renderStoreItems() {
            const card = document.getElementById("storeCard");
            if (!card || !currentPlan) return;
            const items = currentPlan.storeItems || [];
            const otherItems = currentPlan.otherItems || [];
            const totalCount = items.length + otherItems.length;
            const isAr = !!currentPlan.isAr;
            const whyLabel = isAr ? "لماذا اخترناه: " : "Why chosen: ";
            const connLabel = isAr ? "طريقة التوصيل: " : "How to connect: ";

            if (!totalCount) {
                card.innerHTML = '<div class="section-title"><i class="fa-solid fa-store"></i> From Arduino Hub</div>' +
                    '<p class="result-overview">We couldn\'t match any of the required parts to products in the store right now.</p>' +
                    '<a href="shop.html" class="btn-secondary" style="margin-top:16px;"><i class="fa-solid fa-store"></i> Browse the shop</a>';
                return;
            }

            let total = 0;
            const storeRows = items.map(function(it, idx) {
                const line = unitPrice(it.product) * it.qty;
                total += line;
                return '<div class="part-row">' +
                    '<div class="part-img"><img src="' + escapeHTML(it.product.image) + '" alt="" onerror="this.style.visibility=\'hidden\'"></div>' +
                    '<div class="part-info"><div class="part-name">' + escapeHTML(it.product.title) + '</div>' +
                    (it.reason ? '<div class="part-reason"><b style="color:#38bdf8;">💡 ' + whyLabel + '</b>' + escapeHTML(it.reason) + '</div>' : '') +
                    (it.connection ? '<div class="part-reason" style="margin-top:4px;padding:4px 8px;border-radius:6px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);color:#bae6fd;"><b>🔌 ' + connLabel + '</b>' + escapeHTML(it.connection) + '</div>' : '') +
                    '</div>' +
                    '<div class="part-price"><b>EGP ' + line.toFixed(2) + '</b><small>' + it.qty + ' &times; ' + unitPrice(it.product).toFixed(2) + '</small></div>' +
                    '<button type="button" class="part-remove" title="Remove" onclick="removePart(' + idx + ')"><i class="fa-solid fa-xmark"></i></button>' +
                    '</div>';
            }).join("");

            const otherRows = otherItems.map(function(o) {
                return '<div class="part-row">' +
                    '<div class="part-img" style="display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:1.3rem;"><i class="fa-solid fa-microchip"></i></div>' +
                    '<div class="part-info"><div class="part-name">' + escapeHTML(o.name) + '</div>' +
                    (o.reason ? '<div class="part-reason"><b style="color:#38bdf8;">💡 ' + whyLabel + '</b>' + escapeHTML(o.reason) + '</div>' : '') +
                    (o.connection ? '<div class="part-reason" style="margin-top:4px;padding:4px 8px;border-radius:6px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);color:#bae6fd;"><b>🔌 ' + connLabel + '</b>' + escapeHTML(o.connection) + '</div>' : '') +
                    '</div>' +
                    '<div class="part-price"><b style="color:#f59e0b;">Undefined price</b><small>&times;' + (o.qty || 1) + '</small></div>' +
                    '</div>';
            }).join("");

            card.innerHTML =
                '<div class="section-title"><i class="fa-solid fa-microchip"></i> Project Components (' + totalCount + ')</div>' +
                storeRows + otherRows +
                '<div class="total-bar"><span>Total (Store Items)</span><b>EGP ' + total.toFixed(2) + '</b></div>' +
                (items.length ? '<button type="button" class="btn-primary" id="buyAllBtn" onclick="buyAll()"><i class="fa-solid fa-cart-plus"></i> Buy Available Components &amp; Add to Cart</button>' : '') +
                '<div class="cart-actions" id="cartActions">' +
                    '<a href="checkout.html" class="btn-primary"><i class="fa-solid fa-lock"></i> Go to Checkout</a>' +
                    '<a href="shop.html" class="btn-secondary"><i class="fa-solid fa-store"></i> Continue Shopping</a>' +
                '</div>';
        }

        function removePart(idx) {
            if (!currentPlan) return;
            currentPlan.storeItems.splice(idx, 1);
            renderStoreItems();
        }

        // Adds every listed store component to the same cart used by the shop (localStorage)
        function buyAll() {
            if (!currentPlan || !currentPlan.storeItems.length) return;
            const cart = readCart();

            currentPlan.storeItems.forEach(function(it) {
                const existing = cart.find(function(c) { return String(c.id) === String(it.product.id); });
                if (existing) existing.qty += it.qty;
                else cart.push({ id: it.product.id, title: it.product.title, price: unitPrice(it.product), image: it.product.image, qty: it.qty });
            });

            localStorage.setItem("arduino_hub_cart", JSON.stringify(cart));
            updateCartBadge();

            const btn = document.getElementById("buyAllBtn");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> All ' + currentPlan.storeItems.length + ' items added to cart';
            document.getElementById("cartActions").classList.add("show");
            showToast("Added to your cart");
        }
        const _kPart4 = "ZTaEpqOE00SmgxdEE=";

        /* ---------------- init ---------------- */
        document.addEventListener("DOMContentLoaded", function() {
            updateCartBadge();
            loadCatalog().then(function(c) { catalog = c; });   // warm up while the user is typing
            document.getElementById("projectInput").addEventListener("keydown", function(e) {
                if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generatePlan(); }
            });
        });
    </script>
